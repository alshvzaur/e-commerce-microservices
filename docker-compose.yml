services:
  # --- USER SERVICE ---
  user-db:
    image: postgres:16
    environment:
      POSTGRES_DB: user_db
      POSTGRES_USER: ${DB_USERNAME}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    ports:
      - "5432:5432"
    volumes:
      - user-pgdata:/var/lib/postgresql/data

  user-service:
    build: ./user-service          # путь к папке с Dockerfile
    depends_on:
      - user-db
    ports:
      - "8081:8081"
    environment:
      DB_USERNAME: ${DB_USERNAME}
      DB_PASSWORD: ${DB_PASSWORD}
      JWT_SECRET: ${JWT_SECRET}
      SPRING_DATASOURCE_URL: jdbc:postgresql://user-db:5432/user_db

  # --- PRODUCT SERVICE ---
  product-db:
    image: postgres:16
    environment:
      POSTGRES_DB: product_db
      POSTGRES_USER: ${DB_USERNAME}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    ports:
      - "5433:5432"
    volumes:
      - product-pgdata:/var/lib/postgresql/data

  product-service:
    build: ./product-service
    depends_on:
      - product-db
    ports:
      - "8082:8082"
    environment:
      DB_USERNAME: ${DB_USERNAME}
      DB_PASSWORD: ${DB_PASSWORD}
      JWT_SECRET: ${JWT_SECRET}
      SPRING_DATASOURCE_URL: jdbc:postgresql://product-db:5432/product_db

  # --- ORDER SERVICE ---
  order-db:
    image: postgres:16
    environment:
      POSTGRES_DB: order_db
      POSTGRES_USER: ${DB_USERNAME}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    ports:
      - "5434:5432"
    volumes:
      - order-pgdata:/var/lib/postgresql/data

  order-service:
    build: ./order-service
    depends_on:
      - order-db
    ports:
      - "8083:8083"
    environment:
      DB_USERNAME: ${DB_USERNAME}
      DB_PASSWORD: ${DB_PASSWORD}
      JWT_SECRET: ${JWT_SECRET}
      SPRING_DATASOURCE_URL: jdbc:postgresql://order-db:5432/order_db
      PRODUCT_SERVICE_URL: http://product-service:8082

volumes:
  user-pgdata:
  product-pgdata:
  order-pgdata: